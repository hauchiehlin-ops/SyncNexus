<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgC" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181D29" />
      <stop offset="100%" stop-color="#0A0D14" />
    </linearGradient>

    <!-- Shield Rim Gradient -->
    <linearGradient id="shieldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FFA3" />
      <stop offset="50%" stop-color="#00C8FF" />
      <stop offset="100%" stop-color="#3A6DFF" />
    </linearGradient>

    <!-- Node Pulse Radial Gradient -->
    <radialGradient id="corePulse" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#4FACFE" stop-opacity="0" />
    </radialGradient>

    <filter id="hyperGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="shadowC" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Container Squircle -->
  <rect x="32" y="32" width="448" height="448" rx="100" ry="100" fill="url(#bgC)" filter="url(#shadowC)" stroke="#222A3B" stroke-width="2"/>

  <!-- Outer Cryptographic Integrity Shield Contour -->
  <path d="M 256 90 
           C 340 90, 390 125, 390 180 
           C 390 280, 290 365, 256 405 
           C 222 365, 122 280, 122 180 
           C 122 125, 172 90, 256 90 Z" 
        fill="rgba(0, 230, 255, 0.05)" 
        stroke="url(#shieldRim)" 
        stroke-width="12" 
        stroke-linejoin="round"
        filter="url(#hyperGlow)"/>

  <!-- Triangular Peer Nodes (P2P Mesh - Mac, Android, Storage) -->
  <!-- Top Node (Mac) -->
  <circle cx="256" cy="170" r="22" fill="#00E5FF" filter="url(#hyperGlow)"/>
  <circle cx="256" cy="170" r="10" fill="#FFFFFF"/>

  <!-- Bottom Left Node (Android) -->
  <circle cx="190" cy="285" r="22" fill="#00FF88" filter="url(#hyperGlow)"/>
  <circle cx="190" cy="285" r="10" fill="#FFFFFF"/>

  <!-- Bottom Right Node (External Storage) -->
  <circle cx="322" cy="285" r="22" fill="#7000FF" filter="url(#hyperGlow)"/>
  <circle cx="322" cy="285" r="10" fill="#FFFFFF"/>

  <!-- Tri-directional Synchronizing Energy Arcs -->
  <path d="M 256 170 L 190 285" stroke="#FFFFFF" stroke-width="6" stroke-dasharray="10 8" stroke-linecap="round" opacity="0.85"/>
  <path d="M 190 285 L 322 285" stroke="#FFFFFF" stroke-width="6" stroke-dasharray="10 8" stroke-linecap="round" opacity="0.85"/>
  <path d="M 322 285 L 256 170" stroke="#FFFFFF" stroke-width="6" stroke-dasharray="10 8" stroke-linecap="round" opacity="0.85"/>

  <!-- Central Nexus Core Spark -->
  <circle cx="256" cy="250" r="24" fill="url(#corePulse)" filter="url(#hyperGlow)"/>
  <circle cx="256" cy="250" r="8" fill="#FFFFFF"/>
</svg>
