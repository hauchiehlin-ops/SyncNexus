<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141824" />
      <stop offset="100%" stop-color="#07090E" />
    </linearGradient>
    
    <!-- Primary Cyan/Blue Loop -->
    <linearGradient id="loopBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#0080FF" />
      <stop offset="100%" stop-color="#7000FF" />
    </linearGradient>

    <!-- Secondary Emerald/Mint Loop -->
    <linearGradient id="loopGreen" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E676" />
      <stop offset="60%" stop-color="#00B0FF" />
      <stop offset="100%" stop-color="#00E5FF" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- macOS Style Squircle Canvas with Drop Shadow -->
  <rect x="32" y="32" width="448" height="448" rx="100" ry="100" fill="url(#bgGrad)" filter="url(#softShadow)" stroke="#232B3E" stroke-width="2"/>
  
  <!-- Subtle Inner Specular Rim -->
  <rect x="34" y="34" width="444" height="444" rx="98" ry="98" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

  <!-- Left Loop (Source / Ingress) -->
  <path d="M 180 180 C 120 180, 80 215, 80 256 C 80 297, 120 332, 180 332 C 240 332, 272 256, 332 256 C 392 256, 432 291, 432 332" 
        fill="none" stroke="url(#loopBlue)" stroke-width="36" stroke-linecap="round" filter="url(#neonGlow)"/>

  <!-- Right Loop (Target / Egress) Intersecting Flow -->
  <path d="M 332 332 C 392 332, 432 297, 432 256 C 432 215, 392 180, 332 180 C 272 180, 240 256, 180 256 C 120 256, 80 221, 80 180" 
        fill="none" stroke="url(#loopGreen)" stroke-width="36" stroke-linecap="round" filter="url(#neonGlow)" opacity="0.95"/>

  <!-- Central Nexus Core Particle -->
  <circle cx="256" cy="256" r="14" fill="#FFFFFF" filter="url(#neonGlow)"/>
</svg>
