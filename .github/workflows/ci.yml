name: CI - Build and Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-macos:
    name: macOS Test & Sandboxed App Build
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      - name: Run Swift Core Tests
        run: swift test

      - name: Build Sandboxed App
        run: Scripts/build-app.sh --sandbox

  test-android:
    name: Android Project Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant Gradle execute permission
        run: |
          cd Platforms/Android
          if [ -f gradlew ]; then chmod +x gradlew; fi

      - name: Check Android Project Files
        run: |
          test -f Platforms/Android/app/src/main/AndroidManifest.xml
          test -f Platforms/Android/app/build.gradle.kts
          echo "Android project structure verified."

  test-windows:
    name: Windows .NET Build & Tests
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore Platforms/Windows/SyncNexus.sln

      - name: Build Solution
        run: dotnet build Platforms/Windows/SyncNexus.sln --no-restore -c Release

      - name: Run Core Tests
        run: dotnet test Platforms/Windows/tests/SyncNexus.Core.Tests/ --no-build -c Release --verbosity normal

      - name: Publish Desktop App (win-x64)
        run: dotnet publish Platforms/Windows/src/SyncNexus.Desktop/SyncNexus.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish/win-x64

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SyncNexus-Windows-x64
          path: publish/win-x64/

